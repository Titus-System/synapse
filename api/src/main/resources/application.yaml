spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ${app.service.name}
    version: ${app.service.version}
  profiles:
    active: ${app.environment}

# Único lugar que lê variável de ambiente. Todo o resto consome app.*.
app:
  environment: ${ENVIRONMENT:development}
  service:
    name: ${SERVICE_NAME:api}
    description: ${SERVICE_DESCRIPTION:}
    public-url: ${SERVICE_PUBLIC_URL:http://localhost:8080}
    version: ${VERSION:0.0.1-SNAPSHOT}
  observability:
    log-level: ${LOG_LEVEL:INFO}
    log-path: ${LOG_PATH:logs}
    trace-sample-rate: ${TRACE_SAMPLE_RATE:1.0}
    otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
    host: ${HOSTNAME:}
  postgres:
    host: ${POSTGRES_HOST:localhost}
    port: ${POSTGRES_PORT:5432}
    user: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    database: ${POSTGRES_DB:api_db}

logging:
  level:
    root: ${app.observability.log-level}

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        # Expor `metrics` aqui colidiria com o path-mapping acima.
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${app.observability.trace-sample-rate}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${app.observability.otlp-endpoint}/v1/traces
  # O Alloy já coleta métricas por scrape e logs por stdout; sem isto o starter de
  # OpenTelemetry duplicaria ambos por OTLP.
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
