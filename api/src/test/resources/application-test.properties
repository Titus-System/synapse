# Perfil dos testes que sobem o contexto sem banco. O DataSource existe como bean, mas
# o Hikari só conecta no primeiro getConnection() - basta que nada o use na subida.
# Sem isto o Liquibase conectaria ao criar o contexto, e o contribuidor de health "db"
# derrubaria o status UP que MetricsEndpointTests afirma.
# Os testes de migration não usam este perfil: eles sobem um Postgres de verdade.
spring.liquibase.enabled=false
management.health.db.enabled=false

# Idem para o RabbitMQ: sem broker neste perfil. dynamic=false remove o bean AmqpAdmin
# e, com ele, o ApplicationRunner que força a primeira conexão (RabbitTopologyConfig);
# sem isto o health indicator tentaria conectar de verdade e derrubaria o status UP.
# Os testes de topologia não usam este perfil: eles sobem um RabbitMQ de verdade.
spring.rabbitmq.dynamic=false
management.health.rabbit.enabled=false

# O poller do outbox consultaria o banco a cada ciclo. Os testes do outbox o chamam à mão
# ou o religam no próprio contexto.
app.outbox.enabled=false

# Idem para o listener de etapa-alterada (EtapaAlteradaConsumidor): sem broker neste
# perfil, o container tentaria conectar em background e falharia silenciosamente contra
# nada. Os testes do consumidor não usam este perfil: eles sobem um RabbitMQ de verdade.
spring.rabbitmq.listener.simple.auto-startup=false
