name: Validar contratos

on:
  pull_request:
    paths:
      - 'contracts/**'
  push:
    branches:
      - develop
    paths:
      - 'contracts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-exemplos:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar validador
        run: python -m pip install --requirement contracts/requirements.txt

      - name: Validar exemplos
        run: python contracts/validar-exemplos.py

      - name: Testar falha do validador
        run: python contracts/testar-validador.py
