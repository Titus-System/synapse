name: cd-gateway

on:
  push:
    # CD de staging: dispara só em push para 'staging'.
    # NÃO roda para 'develop' - essa branch passa apenas pela CI de verificação.
    branches:
      - staging
    paths:
      - 'deploy/gateway/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Mesmo grupo dos outros cd-*.yml: todos fazem checkout no mesmo diretório
  # do droplet (git reset --hard) - precisa serializar com eles, não só
  # consigo mesmo.
  group: cd-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Implantar gateway em staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            git fetch origin staging
            git reset --hard origin/staging

            # Sem build (a imagem do Caddy vem pronta do Docker Hub, pinada
            # no compose) - só recria o container pra ele reler o
            # deploy/gateway/Caddyfile atual.
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --force-recreate gateway
