name: Verificar Keycloak E11
on:
  pull_request:
    paths:
      - 'deploy/keycloak/**'
      - 'deploy/scripts/seed.py'
      - 'deploy/docker-compose.yml'
      - '.github/workflows/verificar-keycloak.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fluxos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências de teste
        run: python -m pip install -r deploy/keycloak/tests/requirements.txt -r deploy/scripts/requirements.txt
      - name: Subir identidade descartável
        run: docker compose -p synapse-e11-test -f deploy/keycloak/tests/compose.yml up -d --wait --wait-timeout 240
      - name: Testar configuração e fluxos nativos
        env:
          KEYCLOAK_E2E_URL: http://localhost:8180
          KEYCLOAK_E2E_METRICS_URL: http://localhost:9000/metrics
          KEYCLOAK_E2E_SMTP_HOST: mailpit
          KEYCLOAK_E2E_MAILPIT_URL: http://localhost:8026
          KEYCLOAK_ADMIN_PASSWORD: e11-local-tests-only
        run: python -m unittest discover -s deploy/keycloak/tests -v
      - name: Encerrar ambiente de teste
        if: always()
        run: docker compose -p synapse-e11-test -f deploy/keycloak/tests/compose.yml down -v
