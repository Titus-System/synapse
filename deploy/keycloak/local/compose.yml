name: synapse-e11-local

# Exclusivo para desenvolvimento local. Não usa a infraestrutura de produção.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: synapse_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${E11_DB_PASSWORD:?execute python deploy/keycloak/local/iniciar.py}
      SYNAPSE_API_DB_PASSWORD: ${E11_DB_PASSWORD}
      SYNAPSE_CODEGEN_DB_PASSWORD: ${E11_DB_PASSWORD}
      SYNAPSE_WORKER_DB_PASSWORD: ${E11_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/010-usuarios.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d synapse_db']
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: synapse
      RABBITMQ_DEFAULT_PASS: ${E11_BROKER_PASSWORD:?execute python deploy/keycloak/local/iniciar.py}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - '127.0.0.1:8025:8025'
    # SMTP fica somente na rede Docker: Keycloak não precisa entrar no Windows.
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm --hostname=http://localhost:8081 --metrics-enabled=true --event-metrics-user-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${E11_ADMIN_PASSWORD:?execute python deploy/keycloak/local/iniciar.py}
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - ../realm-synapse.json:/opt/keycloak/data/import/realm-synapse.json:ro
      - ../themes:/opt/keycloak/themes:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ['CMD', 'bash', '-ec', "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      mailpit:
        condition: service_healthy

  api:
    build:
      context: ../../..
      dockerfile: api/Dockerfile
    environment:
      SERVICE_NAME: synapse-api
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: synapse_db
      SYNAPSE_API_DB_USER: synapse_api
      SYNAPSE_API_DB_PASSWORD: ${E11_DB_PASSWORD}
      POSTGRES_OWNER_USER: postgres
      POSTGRES_OWNER_PASSWORD: ${E11_DB_PASSWORD}
      SYNAPSE_CODEGEN_DB_USER: synapse_codegen
      SYNAPSE_WORKER_DB_USER: synapse_worker
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: synapse
      RABBITMQ_PASSWORD: ${E11_BROKER_PASSWORD}
      KEYCLOAK_ENABLED: 'true'
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/synapse
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/synapse/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # A validação de identidade não precisa de provedores de voz/IA.
      TRANSCRIPTION_PROCESSOR_ENABLED: 'false'
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/actuator/health']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  frontend-build:
    profiles: ['build']
    build:
      context: ../../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_KEYCLOAK_URL: http://localhost:8081
        VITE_KEYCLOAK_REALM: synapse
        VITE_KEYCLOAK_CLIENT_ID: synapse-frontend
    command: ['sh', '-c', 'rm -rf /dist/* && cp -r /app/dist/. /dist/']
    volumes:
      - frontend-dist:/dist

  frontend:
    image: caddy:2-alpine
    ports:
      - '127.0.0.1:5173:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend-dist:/srv/app:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  rabbitmq-data:
  keycloak-data:
  frontend-dist:
