name: synapse-infra

services:  
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: synapse-frontend:${TAG:-local}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/healthz']
      interval: 30s
      timeout: 3s
      retries: 3

  codegen:
    build:
      context: ..
      dockerfile: codegen/Dockerfile
    image: synapse-codegen:${TAG:-local}
    restart: unless-stopped
    environment:
      SERVICE_NAME: synapse-codegen
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-synapse_db}
      SYNAPSE_CODEGEN_DB_USER: ${SYNAPSE_CODEGEN_DB_USER:-synapse_codegen}
      SYNAPSE_CODEGEN_DB_PASSWORD: ${SYNAPSE_CODEGEN_DB_PASSWORD:?defina em deploy/.env}
    ports:
      - '${CODEGEN_PORT:-8001}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8000/health']
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - synapse-net

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: synapse-worker:${TAG:-local}
    restart: unless-stopped
    environment:
      SERVICE_NAME: synapse-worker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-synapse_db}
      SYNAPSE_WORKER_DB_USER: ${SYNAPSE_WORKER_DB_USER:-synapse_worker}
      SYNAPSE_WORKER_DB_PASSWORD: ${SYNAPSE_WORKER_DB_PASSWORD:?defina em deploy/.env}
    ports:
      - '${WORKER_PORT:-8002}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8000/health']
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - synapse-net

  postgres:
    image: postgres:18-alpine
    container_name: synapse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapse_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Consumidos pelo script de initdb, que cria um usuário por serviço.
      SYNAPSE_API_DB_USER: ${SYNAPSE_API_DB_USER:-synapse_api}
      SYNAPSE_API_DB_PASSWORD: ${SYNAPSE_API_DB_PASSWORD:?defina em deploy/.env}
      SYNAPSE_CODEGEN_DB_USER: ${SYNAPSE_CODEGEN_DB_USER:-synapse_codegen}
      SYNAPSE_CODEGEN_DB_PASSWORD: ${SYNAPSE_CODEGEN_DB_PASSWORD:?defina em deploy/.env}
      SYNAPSE_WORKER_DB_USER: ${SYNAPSE_WORKER_DB_USER:-synapse_worker}
      SYNAPSE_WORKER_DB_PASSWORD: ${SYNAPSE_WORKER_DB_PASSWORD:?defina em deploy/.env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Roda só na primeira subida, com o volume vazio. Ver docs/instalacao.md.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - synapse-net

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: synapse-api:${TAG:-local}
    restart: unless-stopped
    environment:
      SERVICE_NAME: synapse-api
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-synapse_db}
      # Com o que a api opera.
      SYNAPSE_API_DB_USER: ${SYNAPSE_API_DB_USER:-synapse_api}
      SYNAPSE_API_DB_PASSWORD: ${SYNAPSE_API_DB_PASSWORD:?defina em deploy/.env}
      # usado para aplicação das migrations
      POSTGRES_OWNER_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Nomes usados nos GRANT dos changesets; têm que bater com os do initdb.
      SYNAPSE_CODEGEN_DB_USER: ${SYNAPSE_CODEGEN_DB_USER:-synapse_codegen}
      SYNAPSE_WORKER_DB_USER: ${SYNAPSE_WORKER_DB_USER:-synapse_worker}
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/actuator/health']
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - synapse-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: synapse-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - synapse-net

volumes:
  caddy_data:
  caddy_config:
  postgres-data:
    name: synapse-postgres-data
  rabbitmq-data:
    name: synapse-rabbitmq-data

networks:
  synapse-net:
    name: synapse-net
    driver: bridge
