        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/JobNaoEncontrado"

  /jobs/{id}/simulacoes/{simulacaoId}/linhas:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: simulacaoId
        in: path
        required: true
        description: Identificador da simulação pertencente ao job.
        schema:
          type: string
          format: uuid
    get:
      tags: [jobs]
      operationId: consultarLinhasSimulacao
      summary: Consulta o detalhamento da simulação por competência e matrícula.
      description: |
        Devolve o detalhamento completo do período, sem filtros nem paginação.
        Cada matrícula aparece uma única vez por competência, com a loja e a
        marca da lotação no RH naquele mês, como no baseline congelado. Valores e
        diferenças já vêm calculados pelo harness; o frontend só apresenta.

        Exige a mesma autenticação, papel e posse da consulta do job: o
        solicitante deve ser dono do job ou ter o papel `auditor` que autoriza
        a consulta. A simulação precisa pertencer ao job informado.

        Sem detalhamento, responde 200 e omite `linhas`: isso inclui simulações
        ainda sem resultado, resultados com status diferente de `sucesso` e
        resultados anteriores à inclusão do detalhamento. Uma simulação
        inexistente ou pertencente a outro job responde 404 com
        `simulacao_nao_encontrada`; um job inexistente usa `job_nao_encontrado`.
      responses:
        "200":
          description: A simulação consultada e seu detalhamento, quando disponível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetalhamentoSimulacao"
              examples:
                comDetalhamento:
                  summary: Competências com comissão preservada, aumento percentual e bônus
                  description: |
                    Regra hipotética: nucleo.percentual aumenta em 0,5 ponto
                    percentual a comissão da marca 10, e elem.1 dá R$ 500 à
                    MATRIC-1 em novembro. As comissões do baseline são congeladas.
                    MATRIC-422 também vendeu na marca 30, loja 47 em agosto, mas
                    aparece uma vez, na marca 10 e loja 13 da lotação no RH.
                  value:
                    simulacao_id: "b81e0f4c-52a9-4f0b-8a3d-7c2e5d10ab93"
                    linhas:
                      "2025-08":
                        MATRIC-1:
                          cod_loja: "75"
                          cod_marca: "20"
                          cod_cargo: "200"
                          comissao_baseline: 524.25
                          comissao_simulada: 524.25
                          diferenca: 0
                          contribuicoes: {}
                        MATRIC-422:
                          cod_loja: "13"
                          cod_marca: "10"
                          cod_cargo: "150"
                          comissao_baseline: 1065.03
                          comissao_simulada: 1597.55
                          diferenca: 532.52
                          contribuicoes: { nucleo.percentual: 532.52 }
                      "2025-11":
                        MATRIC-1:
                          cod_loja: "75"
                          cod_marca: "20"
                          cod_cargo: "200"
                          comissao_baseline: 619.63
                          comissao_simulada: 1119.63
                          diferenca: 500.0
                          contribuicoes: { elem.1: 500.0 }
                semDetalhamento:
                  summary: Simulação existente sem detalhamento disponível
                  value:
                    simulacao_id: "b81e0f4c-52a9-4f0b-8a3d-7c2e5d10ab93"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          description: Job inexistente, ou simulação inexistente ou que não pertence ao job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                jobNaoEncontrado:
                  value:
                    codigo: job_nao_encontrado
                    mensagem: Job não encontrado.
                simulacaoNaoEncontrada:
                  value:
                    codigo: simulacao_nao_encontrada
                    mensagem: Simulação não encontrada neste job.

  /jobs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      operationId: acompanharJob
      summary: Abre o stream SSE de acompanhamento do job.
      description: |
        **Esta rota abre um stream Server-Sent Events**, não uma resposta única: o
        corpo é `text/event-stream` e a conexão fica aberta enquanto o job processa.

        **Ao conectar, o cliente recebe imediatamente um evento `estado` com a
        situação atual do job**, mesmo que nada tenha acabado de mudar.

        **O evento `estado` traz o status, nunca o conteúdo da regra.** Se o status
        recebido for `aguardando_confirmacao_parametros` - seja na conexão inicial ou
        numa reconexão -, o stream por si só não dá o que exibir na tela de
        confirmação. O cliente busca as versões em `GET /jobs/{id}`, cujo campo
        `regras` traz as representações estruturadas já formadas.

        **Depois vêm os eventos conforme acontecem**: `etapa` a cada passo iniciado,
        `estado` a cada transição do job e `resultado` quando a simulação termina. O
        stream fecha logo após o evento de estado que anuncia um estado terminal;
        abrir o stream de um job já terminal devolve a fotografia e fecha em
        seguida.

        **Reconexão.** Se a conexão cair, o cliente reabre a
        mesma requisição e recebe de novo a fotografia do estado atual.

        **Enquadramento.** Cada evento ocupa uma linha `event:` com o nome, uma linha
        `id:` com um identificador numérico crescente e uma linha `data:` com o JSON
        descrito no schema desta resposta. O `id` é o mesmo em toda conexão que recebe
        aquele evento, mas não sobrevive a um reinício da `api` - a reconexão não
        retoma a partir dele, e sim pela fotografia.

        **Heartbeat.** Em intervalo fixo, o servidor envia uma linha de comentário SSE
        (`:` seguido de texto) sem `event:` nem `data:`. O `EventSource` do navegador a
        ignora silenciosamente; ela existe para manter a conexão viva através de proxy
        e para o servidor detectar o cliente que saiu.
      responses:
        "200":
          description: |
            Stream aberto. O schema descreve o JSON de uma linha `data:`; o corpo da
            resposta é a sequência desses eventos, não um documento único.
          headers:
            Cache-Control:
              description: Sempre `no-store`; o progresso de um job não é cacheável.
              schema:
                type: string
                examples: ["no-store"]
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/EventoProgresso"
              examples:
                streamDeUmJob:
                  summary: Sequência típica, da conexão ao resultado
                  description: |
                    O corpo inteiro da resposta, e não um evento isolado. O primeiro
                    evento é a fotografia recebida ao conectar; os demais chegam
                    conforme acontecem. O schema acima descreve o JSON de cada linha
                    `data:`; é este exemplo que mostra o enquadramento em volta dele.
                  value: |
                    event: estado
                    id: 1
                    data: {"job_id":"3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021","status":"gerando_regra"}

                    : heartbeat

                    event: etapa
                    id: 2
                    data: {"job_id":"3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021","etapa":"geracao_codigo","status":"iniciada"}

                    event: etapa
                    id: 3
                    data: {"job_id":"3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021","etapa":"delegacao_worker","status":"iniciada"}

                    event: resultado
                    id: 4
                    data: {"job_id":"3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021","simulacao_id":"b81e0f4c-52a9-4f0b-8a3d-7c2e5d10ab93","status":"sucesso","veredito":"inviavel"}

                    event: estado
                    id: 5
                    data: {"job_id":"3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021","status":"simulacao_inviavel","status_anterior":"simulando"}
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/JobNaoEncontrado"

  /jobs/{id}/parameters:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [jobs]
      operationId: confirmarParametros
      summary: Confirma ou corrige a representação da regra e retoma o processamento.
      description: |
        O que o usuário confirma na tela de validação é a representação da regra, e
        nunca código. A `api` grava uma versão nova de regra -
        correção nunca altera a versão anterior - e publica `parametros-confirmados`,
        que abre o ciclo do codegen para a versão confirmada.

        Aceita também `orcamento` e `competencias`, porque a mesma tela permite
        ajustá-los antes de simular, inclusive no reprocessamento de uma regra
        arquivada. Ausentes, os valores atuais do job permanecem.

        Recusa por completude e por coerência, com códigos distintos: núcleo
        incompleto é campo faltando; regra incoerente é a regra ter todos os campos e
        ainda assim não descrever nada simulável, como uma faixa cujo limite inferior
        é maior que o superior. A segunda não rende sugestão de adaptação, e sim
        revisão manual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmarParametrosRequisicao"
      responses:
        "202":
          description: |
            Parâmetros confirmados e processamento retomado. O corpo é o job já em
            `gerando_regra`, com `regra` na versão que acabou de ser confirmada:
            correção do usuário vira versão nova, e é o `id` dela que identifica o que
            será simulado.

            **`simulacao`, `finalizado_em` e `motivo` continuam ausentes.** A operação
            só é aceita com o job em `aguardando_confirmacao_parametros`, estado em que
            nenhuma simulação concluiu. A geração de código e a execução no sandbox são
            assíncronas e começam agora; o desfecho chega pelo stream e, depois dele,
            por `GET /jobs/{id}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                parametrosConfirmados:
                  summary: Parâmetros confirmados com correção, geração em curso
                  value:
                    id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
                    status: gerando_regra
                    origem: formulario
                    competencias: ["2025-11"]
                    orcamento: 485000.0
                    criado_em: "2025-11-24T14:02:00Z"
                    iniciado_em: "2025-11-24T14:03:10Z"
                    submissao_id: "b81e0f4c-52a9-4f0b-8a3d-7c2e5d10ab93"
                    regra:
                      id: "1f2e3d4c-5b6a-4978-8d7c-6e5f4a3b2c1d"
                      versao: 2
                      origem: confirmacao_usuario
                      representacao:
                        nucleo:
                          vigencia: { inicio: "2025-11", fim: "2025-11" }
                          loja: ["13"]
                          marca: ["10", "20"]
                          cargo: ["100", "300"]
                          percentual: 0.03
                        especificacoes: []
                      criada_em: "2025-11-24T14:03:10Z"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/JobNaoEncontrado"
        "409":
          description: |
            O job não está aguardando confirmação de parâmetros. Confirmar duas vezes
            ou confirmar um job já finalizado cai aqui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                estadoInvalido:
                  value:
                    codigo: estado_invalido
                    mensagem: Este job não está aguardando confirmação de parâmetros.
        "422":
          description: |
            A regra não pode ser simulada como está. `codigo` distingue campo ausente
            de conflito entre elementos, e `elementos` localiza o problema na parte da
            regra que o causou.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                nucleoIncompleto:
                  summary: Campo obrigatório ausente
                  value:
                    codigo: nucleo_incompleto
                    mensagem: A regra precisa do percentual de comissionamento para ser simulada.
                    elementos:
                      - ref: nucleo.percentual
                        motivo: Campo obrigatório não informado.
                regraIncoerente:
                  summary: Elementos que se contradizem
                  value:
                    codigo: regra_incoerente
                    mensagem: A vigência termina antes de começar.
                    elementos:
                      - ref: nucleo.vigencia
                        motivo: A competência final é anterior à inicial.

  /jobs/{id}/nome:
    parameters:
      - $ref: "#/components/parameters/JobId"
    put:
      tags: [jobs]
      operationId: renomearJob
      summary: Define o nome de exibição do job.
      description: |
        Grava em `jobs.nome` somente o nome definido pelo usuário, removendo os
        espaços do início e do fim. O nome pertence ao job e é compartilhado por
        todas as versões da regra. Nomes iguais são permitidos, inclusive entre
        jobs do mesmo usuário. Repetir a mesma requisição produz o mesmo resultado.

        Permitida em qualquer estado, inclusive terminal: não altera a regra, a
        simulação nem o estado do job. Não registra renomeação na trilha de
        auditoria nem em `job_acoes` e não emite evento no stream do job.

        Exige sessão válida, papel `profissional-rh` e posse do job, como as demais
        rotas operacionais. As recusas são `401 nao_autenticado`, `403 sem_permissao`
        e `404 job_nao_encontrado`.

        Nome ausente, nulo, vazio, só com espaços ou com mais de 100 caracteres
        após remover os espaços das extremidades recebe `400 requisicao_invalida`.
        Esta rota não permite apagar o nome para voltar ao nome padrão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenomearJobRequisicao"
            examples:
              nomeDefinido:
                value:
                  nome: Comissão de novembro
              espacosNasExtremidades:
                summary: Os espaços das extremidades são removidos antes da gravação
                value:
                  nome: "  Comissão de novembro  "
      responses:
        "200":
          description: Job detalhado com o nome novo, sem transição de estado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetalhado"
              examples:
                jobRenomeado:
                  summary: Job terminal renomeado
                  value:
                    id: "a2c4e6f8-0b1d-4e3f-8a5c-7e9b1d3f5a70"
                    nome: Comissão de novembro
                    status: cancelado
                    origem: texto
                    competencias: ["2025-11"]
                    orcamento: 485000.0
                    criado_em: "2025-11-24T15:10:00Z"
                    finalizado_em: "2025-11-24T15:11:00Z"
                    submissao_id: "e1f3a5c7-9b2d-4f6e-8a0c-2d4f6a8c0e19"
                    regras: []
        "400":
          description: Nome ausente ou inválido após remover os espaços das extremidades.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                nomeInvalido:
                  value:
                    codigo: requisicao_invalida
                    mensagem: Informe um nome de 1 a 100 caracteres.
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/JobNaoEncontrado"

  /jobs/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [jobs]
      operationId: executarAcao
      summary: Executa uma ação de finalização sobre o job.
      description: |
        As quatro ações de fechamento: **confirmar e liberar, cancelar, salvar e
        arquivar**. A `api` aplica a transição de estado, de que é dona, e registra a
        ação na trilha.

        **A liberação é recusada quando a simulação é inviável.** O bloqueio é da
        `api`, não da tela: o alerta visual do frontend é apresentação, e a garantia
        de que uma regra fora do orçamento não vai para produção é da máquina de
        estados. Inviável é regra coerente cujo custo não cabe no
        orçamento, e é caso distinto de asserção violada, em que o número não vale.

        A recusa é `409` e não `403` porque o bloqueio é do estado do job e não do
        papel de quem pede: vale para todos, sem override (DEC-087).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutarAcaoRequisicao"
      responses:
        "200":
          description: Ação aplicada; o job vem no novo estado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetalhado"
              examples:
                liberado:
                  summary: Liberado após simulação viável
                  value:
                    id: "7a8b9c0d-1e2f-4a3b-9c8d-7e6f5a4b3c2d"
                    status: liberado
                    origem: formulario
                    competencias: ["2025-11"]
                    orcamento: 500000.0
                    criado_em: "2025-11-20T09:15:00Z"
                    iniciado_em: "2025-11-20T09:15:30Z"
                    finalizado_em: "2025-11-20T09:22:18Z"
                    submissao_id: "2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6a"
                    regras:
                      - id: "5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b"
                        versao: 1
                        origem: confirmacao_usuario
                        representacao:
                          nucleo:
                            vigencia: { inicio: "2025-11", fim: "2025-11" }
                            loja: ["13"]
                            marca: ["10"]
                            cargo: ["100"]
                            percentual: 0.02
                          especificacoes: []
                        criada_em: "2025-11-20T09:15:00Z"
                    simulacao:
                      id: "9f0a1b2c-3d4e-4f5a-8b6c-7d8e9f0a1b2c"
                      criado_em: "2025-11-20T09:22:10Z"
                      status: sucesso
                      veredito: viavel
                      flag_baixa_rastreabilidade: false
                      resultado:
                        totais:
                          baseline: 300000.0
                          simulado: 312000.0
                          diferenca_abs: 12000.0
                          diferenca_pct: 0.04
                          orcamento: 500000.0
                        assercoes:
                          - nome: sem_comissao_negativa
                            resultado: ok
                            detalhe: null
                        decomposicao:
                          elemento: { "nucleo.percentual": 12000.0 }
                          loja: { "13": 12000.0 }
                          marca: { "10": 12000.0 }
                          cargo: { "100": 12000.0 }
                          competencia: { "2025-11": 12000.0 }
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/JobNaoEncontrado"
        "409":
          description: |
            A ação não é permitida no estado atual. `simulacao_inviavel` é a recusa de
            liberação e tem código próprio, distinto de
            `estado_invalido`, para que a tela possa oferecer o caminho de adaptação
            em vez de repetir a tentativa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                simulacaoInviavel:
                  summary: Liberação recusada por inviabilidade orçamentária
                  value:
                    codigo: simulacao_inviavel
                    mensagem: >-
                      A simulação excede o orçamento informado e a regra não pode ser
                      liberada para produção.
                estadoInvalido:
                  summary: Ação fora do estado que a permite
                  value:
                    codigo: estado_invalido
                    mensagem: Este job já foi finalizado.

  /jobs/{id}/reprocessar:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [jobs]
      operationId: reprocessarJob
      summary: Cria um job novo semeado com a regra de um job anterior.
      description: |
        **Nunca sobrescreve o original.** Cria um job novo, com `job_origem_id`
        apontando para o job informado no caminho e semeado com a representação da
        regra dele. O job anterior e sua trilha ficam intactos.

        O nome definido pelo usuário em `jobs.nome` é copiado para o job novo.
        Renomear qualquer um depois não altera o outro. O nome padrão não é
        gravado: na leitura, a API segue `job_origem_id` até o primeiro job da
        cadeia com submissão, conforme `nome` em `JobResumo` e `JobDetalhado`.

        O job novo nasce em `aguardando_confirmacao_parametros`: o usuário ajusta
        parâmetros e orçamento em `POST /jobs/{id}/parameters` antes de simular de
        novo. `competencias` e `orcamento` podem vir já ajustados
        aqui; ausentes, são copiados do job de origem.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReprocessarRequisicao"
      responses:
        "201":
          description: |
            Job novo criado. O corpo é o job novo, não o de origem, e `Location`
            aponta para ele. Traz `id`, `status`, `origem` como `reprocessamento`,
            `competencias`, `orcamento`, `criado_em`, `job_origem_id` e a `regra`
            semeada a partir do job de origem.

            **`simulacao`, `iniciado_em`, `finalizado_em` e `motivo` são ausentes por
            construção**, pelo mesmo motivo de `POST /jobs`: o job nasce em
            `aguardando_confirmacao_parametros` e nada foi executado nele. O resultado
            do job de origem permanece no job de origem, intacto e consultável.

            `submissao_id` também é ausente. A procedência aqui é outro job, e as duas
            nunca coexistem.
          headers:
            Location:
              description: Caminho do job criado.
              schema:
                type: string
                examples: ["/api/jobs/7d41b0aa-1f6e-4c33-b5a8-2e90c7d41f58"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                jobReprocessado:
                  summary: Job novo, semeado a partir do job de origem
                  value:
                    id: "7d41b0aa-1f6e-4c33-b5a8-2e90c7d41f58"
                    status: aguardando_confirmacao_parametros
                    origem: reprocessamento
                    competencias: ["2025-08", "2025-11"]
                    orcamento: 960000.0
                    criado_em: "2025-12-01T10:00:00Z"
                    job_origem_id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
                    regra:
                      id: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
                      versao: 1
                      origem: reprocessamento
                      representacao:
                        nucleo:
                          vigencia: { inicio: "2025-11", fim: "2025-11" }
                          loja: ["13"]
                          marca: ["10", "20"]
                          cargo: ["100", "300"]
                          percentual: 0.025
                        especificacoes: []
                      criada_em: "2025-12-01T10:00:00Z"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/JobNaoEncontrado"
        "409":
          description: |
            O job de origem não tem regra formada para semear o job novo, ou ainda não
            chegou a um estado que permita reprocessá-lo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                estadoInvalido:
                  value:
                    codigo: estado_invalido
                    mensagem: Este job ainda está em processamento e não pode ser reprocessado.

  /jobs/{id}/rodadas:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      operationId: listarRodadas
      summary: Lista as rodadas de correção do job.
      description: |
        Histórico do loop de correção do job, em ordem de criação: os conflitos que
        cada rodada mostrou, a correção enviada e a versão da regra que dela
        resultou. É a fonte do histórico do chatbot.

        **O histórico vem daqui, e não do stream.** O evento `etapa` anuncia os
        conflitos quando acontecem, mas o stream não guarda o que já passou: depois de
        uma reconexão, ou ao voltar ao job mais tarde, o cliente reconstrói a conversa
        por esta rota.

        Existe no máximo uma rodada aberta, e ela é a última da lista: `pendente`
        aceita uma correção em `POST /submissoes`; `em_transcricao` e
        `em_reextracao` são a correção em processamento, e a entrada fica bloqueada
        até o desfecho. Um job cuja regra nunca teve conflito devolve a lista vazia.
      responses:
        "200":
          description: As rodadas do job, da primeira à mais recente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rodada"
              examples:
                correcaoPendente:
                  summary: Uma correção aplicada, uma reextração que falhou e a rodada pendente
                  value:
                    - id: "5a1c2e3f-4b6d-4e7a-9c8b-0d1e2f3a4b51"
                      rodada_anterior_id: null
                      regra_analisada_id: "9c7d3e21-4a6b-4c8d-9e0f-1a2b3c4d5e6f"
                      conflitos:
                        - elementos: [nucleo.percentual]
                          motivo: percentual ausente
                      correcao:
                        texto: O percentual é de 2,5% sobre as vendas.
                        enviada_em: "2025-11-24T14:03:05Z"
                      regra_resultante_id: "1f2e3d4c-5b6a-4978-8d7c-6e5f4a3b2c1d"
                      estado: corrigida
                      criada_em: "2025-11-24T14:02:40Z"
                    - id: "6b2d3f4a-5c7e-4f8b-8d9c-1e2f3a4b5c62"
                      rodada_anterior_id: "5a1c2e3f-4b6d-4e7a-9c8b-0d1e2f3a4b51"
                      regra_analisada_id: "1f2e3d4c-5b6a-4978-8d7c-6e5f4a3b2c1d"
                      conflitos:
                        - elementos: [nucleo.loja, elem.2]
                          motivo: loja 13 no núcleo e na exclusão
                      correcao:
                        texto: Deixa como estava antes.
                        enviada_em: "2025-11-24T14:04:20Z"
                      regra_resultante_id: null
                      estado: reextracao_falhou
                      criada_em: "2025-11-24T14:03:52Z"
                    - id: "7c3e4a5b-6d8f-4a9c-9eab-2f3a4b5c6d73"
                      rodada_anterior_id: "6b2d3f4a-5c7e-4f8b-8d9c-1e2f3a4b5c62"
                      regra_analisada_id: "1f2e3d4c-5b6a-4978-8d7c-6e5f4a3b2c1d"
                      conflitos:
                        - elementos: [nucleo.loja, elem.2]
                          motivo: loja 13 no núcleo e na exclusão
                      correcao: null
                      regra_resultante_id: null
                      estado: pendente
                      criada_em: "2025-11-24T14:04:41Z"
                correcaoPorVozEmTranscricao:
                  summary: Correção falada à espera da transcrição
                  value:
                    - id: "5a1c2e3f-4b6d-4e7a-9c8b-0d1e2f3a4b51"
                      rodada_anterior_id: null
                      regra_analisada_id: "9c7d3e21-4a6b-4c8d-9e0f-1a2b3c4d5e6f"
                      conflitos:
                        - elementos: [nucleo.percentual]
                          motivo: percentual ausente
                      correcao:
                        tipo: voz
                        texto: null
                        enviada_em: "2025-11-24T14:03:05Z"
                      regra_resultante_id: null
                      estado: em_transcricao
                      criada_em: "2025-11-24T14:02:40Z"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/JobNaoEncontrado"

  /submissoes:
    post:
      tags: [submissoes]
      operationId: criarSubmissao
      summary: Registra uma submissão do usuário - a descrição de uma regra nova ou a correção de uma regra pelo chatbot, por texto ou voz.
      description: |
        Porta de entrada do que o usuário descreve. Cada submissão é nova e
        imutável, e não incorpora nem sobrescreve as anteriores - por isso entra pela
        rota das submissões, e não por `/jobs`. `finalidade` diz para que ela serve,
        e `tipo` diz como o conteúdo chegou, no vocabulário de `submissoes.tipo`.

        **Duas formas de corpo.** O texto vem em `application/json`. A voz vem em
        `multipart/form-data`, com a parte `audio`, o binário da gravação, e a parte
        `parametros`, um JSON com os demais campos (`SubmeterPorVozRequisicao`). O
        texto e a transcrição são conteúdo não confiável: dado a interpretar, nunca
        instrução.

        **Entrada inicial** (`finalidade = entrada_inicial`). Recebe a descrição de
        uma regra nova, com o orçamento e, opcionalmente, as competências, e cria a
        submissão e o job que vai processá-la, na mesma transação que grava o evento
        de outbox. O `tipo` determina a `origem` do job e o estado em que ele nasce:
        `texto` nasce em `gerando_regra`, porque a descrição já está pronta para a
        extração, e `voz` nasce em `aguardando_transcricao`, porque o áudio precisa
        ser transcrito antes. Toda regra nova passa pela extração, e a versão raiz
        aparece em `regras` de `GET /jobs/{id}` quando é extraída. O cliente
        acompanha o job pelo `job.id` da resposta, em `GET /jobs/{id}/events` e
        `GET /jobs/{id}`. A falha da transcrição termina o job em `erro`, com o
        motivo em `GET /jobs/{id}`.

        **Correção** (`finalidade = correcao`). Recebe a correção para os conflitos
        da rodada pendente do job; o cliente não escolhe a rodada. A `api` grava a
        submissão e a registra na rodada pendente, que passa a `em_reextracao` com o
        texto, ou a `em_transcricao` com o áudio. Transcrita, a correção por voz
        segue como a de texto. O codegen reextrai a regra a partir da correção, e a
        versão nova volta à validação.

        **A resposta chega antes do processamento.** O desfecho chega pelo stream de
        `GET /jobs/{id}/events`. Na correção, uma versão ainda com conflitos abre
        outra rodada, uma sem conflitos segue para a geração de código, e uma
        transcrição ou reextração que falha fecha a rodada como `reextracao_falhou`
        e reabre a correção numa rodada `pendente` nova, com os mesmos conflitos.

        **A voz depende da transcrição habilitada no ambiente.** Sem ela,
        `tipo = voz` é recusado com `estado_invalido` nas duas finalidades, e o
        texto continua aceito.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SubmeterEntradaPorTextoRequisicao"
                - $ref: "#/components/schemas/SubmeterCorrecaoRequisicao"
              discriminator:
                propertyName: finalidade
                mapping:
                  entrada_inicial: "#/components/schemas/SubmeterEntradaPorTextoRequisicao"
                  correcao: "#/components/schemas/SubmeterCorrecaoRequisicao"
            examples:
              entradaPorTexto:
                summary: Descrição de uma regra nova, digitada
                value:
                  finalidade: entrada_inicial
                  tipo: texto
                  texto: >-
                    Comissão de 2,5% sobre as vendas para os cargos 100 e 300 das
                    marcas 10 e 20 em novembro de 2025, exceto na loja 58. No dia do
                    aniversário da loja, a comissão dobra.
                  orcamento: 485000.0
                  competencias: ["2025-11"]
              correcaoPorTexto:
                summary: Correção digitada no chatbot
                value:
                  finalidade: correcao
                  tipo: texto
                  job_id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
                  texto: A loja 13 fica na regra; a exclusão vale só para a loja 58.
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SubmeterPorVozRequisicao"
            encoding:
              audio:
                contentType: audio/webm, audio/ogg, audio/wav, audio/mp4
              parametros:
                contentType: application/json
            examples:
              entradaPorVoz:
                summary: Descrição de uma regra nova, falada
                description: |
                  `audio` representa os bytes da gravação, enviados na parte com o
                  `Content-Type` do formato gravado, como `audio/webm;codecs=opus`.
                value:
                  audio: "<bytes da gravação>"
                  parametros:
                    finalidade: entrada_inicial
                    tipo: voz
                    orcamento: 485000.0
                    competencias: ["2025-11"]
              correcaoPorVoz:
                summary: Correção falada no chatbot
                description: |
                  `audio` representa os bytes da gravação, enviados na parte com o
                  `Content-Type` do formato gravado, como `audio/mp4`.
                value:
                  audio: "<bytes da gravação>"
                  parametros:
                    finalidade: correcao
                    tipo: voz
                    job_id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
      responses:
        "201":
          description: |
            Submissão registrada. O corpo é a submissão criada, com o job no estado
            em que ficou depois dela.

            Na entrada inicial, o job é o que acabou de ser criado, em
            `gerando_regra` para texto ou em `aguardando_transcricao` para voz, e não
            há `rodada`.

            Na correção, o job permanece em `aguardando_confirmacao_parametros`
            enquanto a correção é processada, e `rodada` é a rodada que a recebeu, já
            em `em_reextracao` com o texto ou em `em_transcricao` com o áudio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissaoCriada"
              examples:
                entradaPorTexto:
                  summary: Descrição em texto registrada, extração em curso
                  value:
                    id: "e1f3a5c7-9b2d-4f6e-8a0c-2d4f6a8c0e19"
                    tipo: texto
                    finalidade: entrada_inicial
                    criado_em: "2025-11-24T15:10:00Z"
                    job:
                      id: "a2c4e6f8-0b1d-4e3f-8a5c-7e9b1d3f5a70"
                      status: gerando_regra
                entradaPorVoz:
                  summary: Descrição falada registrada, à espera da transcrição
                  value:
                    id: "f2a4b6c8-0d1e-4f3a-9b5c-3e5a7b9c1d2a"
                    tipo: voz
                    finalidade: entrada_inicial
                    criado_em: "2025-11-24T15:12:00Z"
                    job:
                      id: "b3d5f7a9-1c2e-4a4b-8c6d-4f6b8d0e2f3b"
                      status: aguardando_transcricao
                correcaoRegistrada:
                  summary: Correção registrada, reextração em curso
                  value:
                    id: "d8f4b5c6-7e9a-4b0d-8f1c-3a4b5c6d7e84"
                    tipo: texto
                    finalidade: correcao
                    criado_em: "2025-11-24T14:05:10Z"
                    job:
                      id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
                      status: aguardando_confirmacao_parametros
                    rodada:
                      id: "7c3e4a5b-6d8f-4a9c-9eab-2f3a4b5c6d73"
                      rodada_anterior_id: "6b2d3f4a-5c7e-4f8b-8d9c-1e2f3a4b5c62"
                      regra_analisada_id: "1f2e3d4c-5b6a-4978-8d7c-6e5f4a3b2c1d"
                      conflitos:
                        - elementos: [nucleo.loja, elem.2]
                          motivo: loja 13 no núcleo e na exclusão
                      correcao:
                        texto: A loja 13 fica na regra; a exclusão vale só para a loja 58.
                        enviada_em: "2025-11-24T14:05:10Z"
                      regra_resultante_id: null
                      estado: em_reextracao
                      criada_em: "2025-11-24T14:04:41Z"
                correcaoPorVoz:
                  summary: Correção falada registrada, à espera da transcrição
                  value:
                    id: "c9e1a3b5-7d8f-4c0a-9e2b-4b6d8f0a2c95"
                    tipo: voz
                    finalidade: correcao
                    criado_em: "2025-11-24T14:05:10Z"
                    job:
                      id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
                      status: aguardando_confirmacao_parametros
                    rodada:
                      id: "7c3e4a5b-6d8f-4a9c-9eab-2f3a4b5c6d73"
                      rodada_anterior_id: "6b2d3f4a-5c7e-4f8b-8d9c-1e2f3a4b5c62"
                      regra_analisada_id: "1f2e3d4c-5b6a-4978-8d7c-6e5f4a3b2c1d"
                      conflitos:
                        - elementos: [nucleo.loja, elem.2]
                          motivo: loja 13 no núcleo e na exclusão
                      correcao:
                        tipo: voz
                        texto: null
                        enviada_em: "2025-11-24T14:05:10Z"
                      regra_resultante_id: null
                      estado: em_transcricao
                      criada_em: "2025-11-24T14:04:41Z"
        "400":
          description: |
            O corpo não tem a forma esperada. Inclui:

            - o texto vazio, só com espaços ou acima do limite: 8000 caracteres na
              entrada inicial e 4000 na correção;
            - a submissão de texto sem `texto`, e a entrada inicial sem `orcamento`
              ou com competência inválida;
            - o corpo multipart sem a parte `audio` ou sem a parte `parametros`, ou
              com `parametros` fora da forma esperada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                textoVazio:
                  summary: Correção sem texto
                  value:
                    codigo: requisicao_invalida
                    mensagem: Escreva a correção antes de enviar.
                textoLongo:
                  summary: Correção acima do limite
                  value:
                    codigo: requisicao_invalida
                    mensagem: A correção pode ter no máximo 4000 caracteres.
                descricaoLonga:
                  summary: Descrição da regra acima do limite
                  value:
                    codigo: requisicao_invalida
                    mensagem: A descrição da regra pode ter no máximo 8000 caracteres.
                semAudio:
                  summary: Envio por voz sem a gravação
                  value:
                    codigo: requisicao_invalida
                    mensagem: Grave o áudio antes de enviar.
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/JobNaoEncontrado"
        "409":
          description: |
            A submissão não pode ser aceita agora. Na correção, o job não está em
            `aguardando_confirmacao_parametros` ou não tem rodada `pendente`; o
            segundo caso inclui a correção enviada enquanto a anterior ainda está em
            transcrição ou em reextração. Nas duas finalidades, `tipo = voz` é
            recusado enquanto a transcrição não está habilitada no ambiente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                jobForaDaCorrecao:
                  summary: Job fora do estado que aceita correção
                  value:
                    codigo: estado_invalido
                    mensagem: Este job não está aguardando correção.
                semRodadaPendente:
                  summary: Nenhuma rodada pendente, como durante uma reextração
                  value:
                    codigo: estado_invalido
                    mensagem: A correção anterior ainda está sendo processada.
                vozIndisponivel:
                  summary: Envio por voz com a transcrição desabilitada
                  value:
                    codigo: estado_invalido
                    mensagem: O envio por voz não está disponível no momento. Envie o texto.
        "413":
          description: |
            O áudio passa de 5 MB. A `api` responde com este corpo também quando
            recusa a requisição multipart inteira pelo tamanho, para que a recusa
            sempre chegue com o código.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                audioMuitoGrande:
                  value:
                    codigo: audio_muito_grande
                    mensagem: A gravação passa do tamanho máximo de 5 MB.
        "422":
          description: |
            O áudio não pode ser usado: está vazio, o `Content-Type` da parte `audio`
            não é um dos formatos aceitos ou o conteúdo não confere com o formato
            declarado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                audioInvalido:
                  value:
                    codigo: audio_invalido
                    mensagem: Não foi possível usar a gravação. Grave o áudio de novo.

components:
  securitySchemes:
    keycloakOidc:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8081/realms/synapse/.well-known/openid-configuration
      description: |
        Autenticação OIDC emitida pelo Keycloak. O cliente envia o access token como
        `Authorization: Bearer <token>`; a API valida emissor, assinatura e expiração.
        A conta local é associada ao claim `sub`, e o acesso a um job confere posse,
        não apenas autenticação. O papel `auditor` no realm autoriza consulta além da
        própria conta.

  parameters:
    JobId:
      name: id
      in: path
      required: true
      description: Identificador do job.
      schema:
        type: string
        format: uuid
        examples: ["3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"]

  responses:
    RequisicaoInvalida:
      description: O corpo ou os parâmetros da requisição não têm a forma esperada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          examples:
            requisicaoInvalida:
              value:
                codigo: requisicao_invalida
                mensagem: O campo orcamento precisa ser um número.

    NaoAutenticado:
      description: Sessão ausente, expirada ou inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          examples:
            naoAutenticado:
              value:
                codigo: nao_autenticado
                mensagem: Sessão ausente ou expirada.

    SemPermissao:
      description: |
        A sessão é válida, mas o solicitante não é dono do job nem tem papel que
        autorize a operação sobre ele.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          examples:
            semPermissao:
              value:
                codigo: sem_permissao
                mensagem: Você não tem acesso a este job.

    JobNaoEncontrado:
      description: Não existe job com o identificador informado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          examples:
            jobNaoEncontrado:
              value:
                codigo: job_nao_encontrado
                mensagem: Job não encontrado.

  schemas:
    Erro:
      type: object
      title: Erro
      description: |
        Corpo de erro de toda operação. `codigo` é o que o cliente decide em cima;
        `mensagem` é texto que o domínio decidiu expor e nunca detalhe interno, como
        stack trace, mensagem de driver ou nome de tabela.

        `elementos` existe porque interrupção sem motivo é o pior caso para o usuário
        leigo: todo caminho de parada devolve razão localizada na parte da regra que a
        causou, em vez de "não foi possível processar".
      required: [codigo, mensagem]
      properties:
        codigo:
          $ref: "#/components/schemas/CodigoErro"
        mensagem:
          type: string
          minLength: 1
          description: Explicação em linguagem do usuário, própria para exibição direta.
        elementos:
          type: array
          description: |
            Partes da regra que motivaram a recusa. Ausente quando o erro não é sobre
            a regra. Um conflito entre dois elementos rende uma entrada por elemento
            envolvido.
          items:
            type: object
            required: [ref, motivo]
            properties:
              ref:
                $ref: "../domain/comum.schema.json#/$defs/elemento_ref"
              motivo:
                type: string
                minLength: 1
                description: O que falta ou o que conflita neste elemento.

    CodigoErro:
      type: string
      title: Código de erro
      description: |
        Vocabulário de recusa. Cada código tem um status HTTP próprio, e dois motivos
        diferentes nunca compartilham código: `nucleo_incompleto` é dado da regra
        faltando na entrada, `simulacao_inviavel` é regra completa e coerente cujo
        custo não cabe no orçamento. `audio_muito_grande` (413) é o áudio acima do
        tamanho máximo, e `audio_invalido` (422) é o áudio vazio, em formato não
        aceito ou com conteúdo que não confere com o formato. Vocabulário aberto a
        valores novos, sempre de forma aditiva. `simulacao_nao_encontrada` (404)
        indica simulação inexistente ou que não pertence ao job informado.
      enum:
        - requisicao_invalida
        - nao_autenticado
        - sem_permissao
        - job_nao_encontrado
        - simulacao_nao_encontrada
        - estado_invalido
        - simulacao_inviavel
        - nucleo_incompleto
        - regra_incoerente
        - audio_invalido
        - audio_muito_grande

    StatusJob:
      type: string
      title: Estado do job
      description: |
        Estados da máquina de estados do job, de que a `api` é dona. `simulacao_inviavel` e
        `erro` são coisas distintas: o primeiro é uma simulação que terminou bem e
        produziu um número que não cabe no orçamento; o segundo é o job que não chegou
        a produzir número.
      enum:
        - aguardando_transcricao
        - aguardando_confirmacao_parametros
        - gerando_regra
        - simulando
        - simulacao_inviavel
        - aguardando_decisao_usuario
        - liberado
        - cancelado
        - arquivado
        - erro

    OrigemJob:
      type: string
      title: Origem do job
      description: |
        Como o job nasceu, no mesmo vocabulário de `contracts/events/regra-submetida`.
        É o que determina o ponto de entrada do grafo. `formulario` é o único valor
        aceito em `POST /jobs`. `texto` e `voz` nascem de `POST /submissoes` com
        `finalidade = entrada_inicial`, conforme o `tipo` da submissão.
        `reprocessamento` é produzido por `POST /jobs/{id}/reprocessar`.
      enum: [formulario, voz, reprocessamento, texto]

    AcaoJob:
      type: string
      title: Ação de finalização
      description: Ações de fechamento, no mesmo vocabulário da coluna `job_acoes.acao`.
      enum: [confirmar_liberar, cancelar, salvar, arquivar]

    FinalidadeSubmissao:
      type: string
      title: Finalidade da submissão
      description: |
        Para que serve a submissão. `entrada_inicial` é a descrição de uma regra
        nova, que cria o job que vai processá-la; `correcao` é a correção de uma
        regra enviada pelo chatbot durante o loop de correção. Vocabulário aberto a
        valores novos, sempre de forma aditiva.
      enum: [correcao, entrada_inicial]

    TipoSubmissao:
      type: string
      title: Forma da submissão
      description: |
        Como o conteúdo da submissão chegou, com os valores de `submissoes.tipo`
        que `POST /submissoes` recebe: `texto`, digitado pelo usuário, ou `voz`, um
        áudio gravado que a `api` transcreve. Vocabulário aberto a valores novos,
        sempre de forma aditiva.
      enum: [texto, voz]

    Veredito:
      type: string
      title: Veredito de viabilidade
      description: |
        Viabilidade orçamentária, apurada pelo worker fora do container a partir do
        total simulado e do orçamento aplicado. Ausente quando a execução não produziu
        número que o sustente.
      enum: [viavel, inviavel, indeterminado]

    StatusResultado:
      type: string
      title: Desfecho da execução
      description: |
        Mesmo vocabulário de `resultados_simulacao.status`. `assercao_violada` é o
        código ter rodado e produzido números que uma invariante reprovou: é erro do
        código gerado e invalida o número, diferente de `veredito: inviavel`.
      enum: [sucesso, assercao_violada, erro_codigo, erro_infra]

    Competencias:
      type: array
      title: Competências do job
      description: |
        Competências históricas a simular. O job cobre o período inteiro numa única
        simulação, com os meses agregados; não existe uma simulação por competência. A
        contribuição de cada mês sai na quebra `competencia` da decomposição. Não
        precisa ser contíguo. Nunca vazio: um job que não simula nada não é job.
      minItems: 1
      items:
        $ref: "../domain/comum.schema.json#/$defs/competencia"
      examples:
        - ["2025-08", "2025-11"]

    CriarJobRequisicao:
      type: object
      title: Submissão de regra por formulário
      description: |
        Corpo de `POST /jobs`. Carrega a origem do job, as competências de referência,
        o orçamento e o núcleo da regra.

        `conteudo` é o formulário exatamente como foi preenchido, na forma de
        `submissoes.conteudo`: é o registro da entrada, e o que permite conferir
        depois o que o sistema recebeu contra o que ele produziu. Por isso vem no
        formato da coluna e não numa forma própria da requisição.
      required: [origem, orcamento, conteudo]
      properties:
        origem:
          $ref: "#/components/schemas/OrigemJob"
          description: |
            Na Sprint 1, sempre `formulario`. `voz` e
            `reprocessamento` não é submetido por aqui, e sim criado por
            `POST /jobs/{id}/reprocessar`.
        competencias:
          $ref: "#/components/schemas/Competencias"
          description: |
            Competências a simular. Ausente, a `api` preenche com todas as
            competências do dataset - o período inteiro. Anotação de intenção, não
            comportamento de validador: o preenchimento é da `api`.
        orcamento:
          $ref: "../domain/comum.schema.json#/$defs/brl"
          description: |
            Orçamento de comissionamento do período, informado pelo usuário. Não está
            em nenhuma base: é parâmetro da simulação, e confrontá-lo com o total
            apurado é o que dispara o alerta de inviabilidade e o bloqueio da
            liberação. É do período, não mensal.
        conteudo:
          $ref: "../domain/submissao-conteudo.schema.json"
          description: |
            O formulário como recebido: os cinco campos do núcleo, com lista vazia ou
            nulo onde o usuário não preencheu, mais o texto livre. O texto livre é
            conteúdo não confiável - é dado a extrair, nunca instrução.
      examples:
        - origem: formulario
          competencias: ["2025-11"]
          orcamento: 485000.0
          conteudo:
            nucleo:
              vigencia: { inicio: "2025-11", fim: "2025-11" }
              loja: ["13"]
              marca: ["10", "20"]
              cargo: ["100", "300"]
              percentual: 0.025
            texto_livre: null

    ConfirmarParametrosRequisicao:
      type: object
      title: Confirmação dos parâmetros
      description: |
        Corpo de `POST /jobs/{id}/parameters`. `regra` é a representação confirmada ou
        corrigida pelo usuário, no mesmo formato que o banco e o código gerado usam.
        Correção gera uma versão nova de regra; a anterior permanece.
      required: [regra]
      properties:
        regra:
          $ref: "../domain/representacao-regra.schema.json"
          description: |
            Núcleo e especificações juntos. Na Sprint 1 o formulário só permite
            informar o núcleo, então `especificacoes` chega como array vazio; a
            limitação está no que pode ser inserido, nunca no que é simulado daquilo
            que foi inserido.
        orcamento:
          $ref: "../domain/comum.schema.json#/$defs/brl"
          description: |
            Orçamento ajustado na tela de confirmação. Ausente mantém o orçamento
            atual do job.
        competencias:
          $ref: "#/components/schemas/Competencias"
          description: |
            Competências ajustadas na tela de confirmação. Ausente mantém as
            competências atuais do job.
      examples:
        - regra:
            nucleo:
              vigencia: { inicio: "2025-11", fim: "2025-11" }
              loja: ["13"]
              marca: ["10", "20"]
              cargo: ["100", "300"]
              percentual: 0.025
            especificacoes: []
          orcamento: 485000.0

    RenomearJobRequisicao:
      type: object
      title: Nome definido pelo usuário
      description: Corpo de `PUT /jobs/{id}/nome`.
      required: [nome]
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
          description: |
            Nome definido pelo usuário. A API remove os espaços do início e do fim
            antes de validar o limite de 1 a 100 caracteres e gravar; os limites
            se aplicam ao valor normalizado, contado por pontos de código Unicode.
            Espaços internos são preservados. Ausência, null, string vazia ou só
            com espaços são recusados com `requisicao_invalida`. Nomes iguais são
            permitidos. Não permite remover o nome para restaurar o nome padrão.
      examples:
        - nome: Comissão de novembro

    ExecutarAcaoRequisicao:
      type: object
      title: Ação de finalização
      description: Corpo de `POST /jobs/{id}/actions`.
      required: [acao]
      properties:
        acao:
          $ref: "#/components/schemas/AcaoJob"
      examples:
        - acao: confirmar_liberar

    ReprocessarRequisicao:
      type: object
      title: Parâmetros do reprocessamento
      description: |
        Corpo de `POST /jobs/{id}/reprocessar`. Todos os campos são opcionais: o corpo
        pode ser omitido, e então o job novo herda competências e orçamento do job de
        origem.
      properties:
        competencias:
          $ref: "#/components/schemas/Competencias"
          description: Ausente, copia as competências do job de origem.
        orcamento:
          $ref: "../domain/comum.schema.json#/$defs/brl"
          description: Ausente, copia o orçamento do job de origem.
      examples:
        - competencias: ["2025-08", "2025-11"]
          orcamento: 960000.0

    SubmeterCorrecaoRequisicao:
      type: object
      title: Correção enviada pelo chatbot
      description: |
        Corpo de `POST /submissoes` para a correção por texto. A correção vale para a
        rodada pendente do job; o cliente não escolhe a rodada.
      required: [finalidade, tipo, job_id, texto]
      properties:
        finalidade:
          type: string
          const: correcao
          description: Sempre `correcao` neste corpo, um valor de `FinalidadeSubmissao`.
        tipo:
          type: string
          const: texto
          description: Sempre `texto` neste corpo, um valor de `TipoSubmissao`.
        job_id:
          type: string
          format: uuid
          description: |
            Job cuja regra está sendo corrigida. Vai no corpo, e não no caminho,
            porque a rota é a das submissões.
        texto:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: '\S'
          description: |
            A correção como o usuário a escreveu. Não vazia, nem só com espaços, e com
            no máximo 4000 caracteres. É conteúdo não confiável - dado a interpretar,
            nunca instrução.
      examples:
        - finalidade: correcao
          tipo: texto
          job_id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
          texto: A loja 13 fica na regra; a exclusão vale só para a loja 58.

    SubmeterEntradaPorTextoRequisicao:
      type: object
      title: Descrição de uma regra nova, por texto
      description: |
        Corpo JSON de `POST /submissoes` para a entrada inicial por texto. Cria a
        submissão e o job de origem `texto`. `orcamento` e `competencias` seguem as
        mesmas regras de `POST /jobs`.
      required: [finalidade, tipo, texto, orcamento]
      properties:
        finalidade:
          type: string
          const: entrada_inicial
          description: Sempre `entrada_inicial` neste corpo, um valor de `FinalidadeSubmissao`.
        tipo:
          type: string
          const: texto
          description: Sempre `texto` neste corpo, um valor de `TipoSubmissao`.
        texto:
          type: string
          minLength: 1
          maxLength: 8000
          pattern: '\S'
          description: |
            A descrição da regra como o usuário a escreveu. Não vazia, nem só com
            espaços, e com no máximo 8000 caracteres. É conteúdo não confiável - dado
            a extrair, nunca instrução.
        orcamento:
          $ref: "../domain/comum.schema.json#/$defs/brl"
          description: |
            Orçamento de comissionamento do período, informado pelo usuário. É do
            período, não mensal.
        competencias:
          $ref: "#/components/schemas/Competencias"
          description: |
            Competências a simular. Ausente, a `api` preenche com todas as
            competências do dataset - o período inteiro.
      examples:
        - finalidade: entrada_inicial
          tipo: texto
          texto: Comissão de 2,5% sobre as vendas para o cargo 100 da marca 10 em novembro de 2025.
          orcamento: 485000.0

    SubmeterPorVozRequisicao:
      type: object
      title: Submissão por voz
      description: |
        Corpo `multipart/form-data` de `POST /submissoes` para a entrada inicial e
        para a correção por voz. Tem duas partes obrigatórias, em qualquer ordem:
        `audio`, com a gravação, e `parametros`, com a finalidade e os campos que
        ela exige. Partes com outros nomes são ignoradas.

        ```
        POST /api/submissoes
        Content-Type: multipart/form-data; boundary=limite

        --limite
        Content-Disposition: form-data; name="audio"; filename="gravacao.webm"
        Content-Type: audio/webm;codecs=opus

        <bytes da gravação>
        --limite
        Content-Disposition: form-data; name="parametros"
        Content-Type: application/json

        {"finalidade":"entrada_inicial","tipo":"voz","orcamento":485000.0}
        --limite--
        ```

        No navegador, `parametros` entra no `FormData` como um `Blob` de tipo
        `application/json`, para que a parte leve esse `Content-Type`.
      required: [audio, parametros]
      properties:
        audio:
          type: string
          format: binary
          description: |
            A gravação como o navegador a produziu, com no máximo 5 MB. O
            `Content-Type` da parte declara o contêiner, que a `api` registra em
            `submissoes.formato`: `audio/webm`, `audio/ogg`, `audio/wav` ou
            `audio/mp4`, com parâmetros como `codecs` aceitos. O nome do arquivo é
            ignorado. A `api` recusa com `audio_invalido` o áudio vazio, o formato
            fora dessa lista e o conteúdo que não confere com o formato declarado, e
            com `audio_muito_grande` o que passa de 5 MB. A duração máxima de
            gravação, 3 minutos, é imposta pelo cliente, porque a `api` não
            decodifica o áudio.
        parametros:
          oneOf:
            - $ref: "#/components/schemas/ParametrosEntradaPorVoz"
            - $ref: "#/components/schemas/ParametrosCorrecaoPorVoz"
          discriminator:
            propertyName: finalidade
            mapping:
              entrada_inicial: "#/components/schemas/ParametrosEntradaPorVoz"
              correcao: "#/components/schemas/ParametrosCorrecaoPorVoz"
          description: |
            Objeto JSON, na parte com `Content-Type: application/json`. A
            `finalidade` decide os demais campos: a entrada inicial leva `orcamento`
            e, opcionalmente, `competencias`; a correção leva `job_id`.

    ParametrosEntradaPorVoz:
      type: object
      title: Parâmetros da descrição de uma regra nova, por voz
      description: |
        Parte `parametros` de `POST /submissoes` para a entrada inicial por voz. Cria
        a submissão e o job de origem `voz`. `orcamento` e `competencias` seguem as
        mesmas regras de `POST /jobs`.
      required: [finalidade, tipo, orcamento]
      properties:
        finalidade:
          type: string
          const: entrada_inicial
          description: Sempre `entrada_inicial` nestes parâmetros, um valor de `FinalidadeSubmissao`.
        tipo:
          type: string
          const: voz
          description: Sempre `voz` nestes parâmetros, um valor de `TipoSubmissao`.
        orcamento:
          $ref: "../domain/comum.schema.json#/$defs/brl"
          description: |
            Orçamento de comissionamento do período, informado pelo usuário. É do
            período, não mensal.
        competencias:
          $ref: "#/components/schemas/Competencias"
          description: |
            Competências a simular. Ausente, a `api` preenche com todas as
            competências do dataset - o período inteiro.
      examples:
        - finalidade: entrada_inicial
          tipo: voz
          orcamento: 485000.0
          competencias: ["2025-11"]

    ParametrosCorrecaoPorVoz:
      type: object
      title: Parâmetros da correção por voz
      description: |
        Parte `parametros` de `POST /submissoes` para a correção por voz. A correção
        vale para a rodada pendente do job; o cliente não escolhe a rodada.
      required: [finalidade, tipo, job_id]
      properties:
        finalidade:
          type: string
          const: correcao
          description: Sempre `correcao` nestes parâmetros, um valor de `FinalidadeSubmissao`.
        tipo:
          type: string
          const: voz
          description: Sempre `voz` nestes parâmetros, um valor de `TipoSubmissao`.
        job_id:
          type: string
          format: uuid
          description: |
            Job cuja regra está sendo corrigida. Vai nos parâmetros, e não no
            caminho, porque a rota é a das submissões.
      examples:
        - finalidade: correcao
          tipo: voz
          job_id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"

    SubmissaoCriada:
      type: object
      title: Submissão criada
      description: |
        Resposta de `POST /submissoes`. Identifica a submissão gravada e devolve o que
        o cliente precisa para seguir sem outra consulta: o job, no estado em que
        ficou, e, na correção, a rodada que a recebeu.
      required: [id, tipo, finalidade, criado_em, job]
      properties:
        id:
          type: string
          format: uuid
          description: A submissão gravada. Cada submissão é nova e imutável.
        tipo:
          $ref: "#/components/schemas/TipoSubmissao"
        finalidade:
          $ref: "#/components/schemas/FinalidadeSubmissao"
        criado_em:
          type: string
          format: date-time
        job:
          type: object
          description: |
            O job a que a submissão pertence, no estado em que ficou depois dela. Na
            entrada inicial é o job criado com a submissão, e o cliente o acompanha
            pelo `id` nas rotas de `/jobs`.
          required: [id, status]
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/StatusJob"
        rodada:
          $ref: "#/components/schemas/Rodada"
          description: |
            A rodada que recebeu a correção, com `correcao` preenchida: em
            `em_reextracao` quando a correção é por texto e em `em_transcricao`
            quando é por voz. Presente sempre que a finalidade é `correcao`, e
            ausente na entrada inicial.
      allOf:
        - if:
            properties:
              finalidade:
                const: correcao
            required: [finalidade]
          then:
            required: [rodada]

    Job:
      type: object
      title: Job
      description: |
        Estado corrente do job e os artefatos que ele já produziu. Os campos opcionais
        aparecem conforme o job avança; a ausência de `simulacao` significa que ainda
        não há resultado, e não que o resultado é vazio.
      required: [id, status, origem, competencias, orcamento, criado_em]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do job, e a chave de correlação em toda a observabilidade.
        status:
          $ref: "#/components/schemas/StatusJob"
        origem:
          $ref: "#/components/schemas/OrigemJob"
        competencias:
          $ref: "#/components/schemas/Competencias"
        orcamento:
          $ref: "../domain/comum.schema.json#/$defs/brl"
          description: Orçamento do período aplicado a este job.
        criado_em:
          type: string
          format: date-time
        iniciado_em:
          type: string
          format: date-time
          description: Ausente até o processamento começar.
        finalizado_em:
          type: string
          format: date-time
          description: Ausente até o job atingir estado terminal.
        job_origem_id:
          type: string
          format: uuid
          description: |
            Job de que este nasceu por reprocessamento. Ausente no job original.
            Exatamente uma das duas procedências existe: `submissao_id` quando o job
            nasceu de gente, `job_origem_id` quando nasceu de outro job.
        submissao_id:
          type: string
          format: uuid
          description: Submissão que originou o job. Ausente quando a origem é reprocessamento.
        motivo:
          type: string
          description: |
            Razão localizada da parada, quando o job parou. Existe porque interrupção
            sem motivo é inaceitável para o usuário leigo: regra fora do domínio,
            elemento sem implementação correspondente, asserção violada, campo
            obrigatório ausente e conflito entre elementos são casos distintos e
            chegam aqui distinguidos. Ausente fora de paradas.
        regra:
          $ref: "#/components/schemas/RegraVersionada"
          description: Versão corrente da regra. Ausente enquanto nenhuma versão foi formada.
        simulacao:
          $ref: "#/components/schemas/Simulacao"
          description: Simulação corrente do job. Ausente enquanto a execução não terminou.

    JobDetalhado:
      type: object
      title: Job detalhado
      description: |
        Estado corrente do job com todas as versões de regra já formadas. `regras` é
        ordenado por `versao`; `simulacao`, quando existe, representa a execução mais
        recente do job. `simulacoes` preserva as execuções anteriores e permite
        associar cada resultado à sua versão pelo campo `regra_id`.
      required: [id, status, origem, competencias, orcamento, criado_em, regras]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do job, e a chave de correlação em toda a observabilidade.
        nome:
          type: [string, "null"]
          description: |
            Nome de exibição resolvido pela API, compartilhado por todas as versões
            da regra. O nome definido pelo usuário em `jobs.nome` tem prioridade.
            Sem ele, o nome padrão vem de `submissoes.transcricao` da submissão
            inicial apontada por `jobs.submissao_id`, que guarda o texto digitado
            ou a transcrição do áudio. O frontend não calcula o nome padrão.

            A API remove espaços do início e do fim do texto, substitui cada
            sequência de espaços, tabulações e quebras de linha por um único
            espaço e usa os primeiros 50 caracteres do resultado, contados por
            pontos de código Unicode para não cortar um emoji ao meio. Textos
            com até 50 caracteres são usados inteiros, sem reticências. O nome
            padrão não é persistido em `jobs.nome`.

            No job reprocessado, sem submissão própria, a API segue
            `jobs.job_origem_id` até o primeiro job da cadeia com submissão e usa
            esse texto inicial para o nome padrão. O nome definido pelo usuário
            no job de origem é copiado ao reprocessar; renomear um deles depois
            não altera o outro. Correções e novas versões não mudam
            `jobs.submissao_id`, portanto não mudam a origem do nome padrão.

            Ausente quando não há nome definido pelo usuário nem texto inicial
            não vazio após normalização, inclusive formulário com
            `submissoes.transcricao` nulo e voz ainda sem transcrição. Nesse caso,
            o frontend mostra o rótulo com a data de criação. O tipo aceita null
            por compatibilidade com a T-200 D; a API omite o campo sem nome resolvido.
          examples: [Comissão de novembro, "Comissão de 2,5% para vendedores da loja 13"]
        status:
          $ref: "#/components/schemas/StatusJob"
        origem:
          $ref: "#/components/schemas/OrigemJob"
        competencias:
          $ref: "#/components/schemas/Competencias"
        orcamento:
          $ref: "../domain/comum.schema.json#/$defs/brl"
          description: Orçamento do período aplicado a este job.
        criado_em:
          type: string
          format: date-time
        iniciado_em:
          type: string
          format: date-time
          description: Ausente até o processamento começar.
        finalizado_em:
          type: string
          format: date-time
          description: Ausente até o job atingir estado terminal.
        job_origem_id:
          type: string
          format: uuid
          description: |
            Job de que este nasceu por reprocessamento. Ausente no job original.
            Exatamente uma das duas procedências existe: `submissao_id` quando o job
            nasceu de gente, `job_origem_id` quando nasceu de outro job.
        submissao_id:
          type: string
          format: uuid
          description: Submissão que originou o job. Ausente quando a origem é reprocessamento.
        motivo:
          type: string
          description: |
            Razão localizada da parada, quando o job parou. Existe porque interrupção
            sem motivo é inaceitável para o usuário leigo: regra fora do domínio,
            elemento sem implementação correspondente, asserção violada, campo
            obrigatório ausente e conflito entre elementos são casos distintos e
            chegam aqui distinguidos. Ausente fora de paradas.
        regras:
          type: array
          description: |
            Todas as versões da regra do job, ordenadas por versão crescente. Vazia
            enquanto nenhuma versão foi formada, como no job de texto ou de voz antes
            da extração.
          items:
            $ref: "#/components/schemas/RegraVersionada"
        simulacao:
          $ref: "#/components/schemas/Simulacao"
          description: Simulação mais recente do job. Ausente enquanto nenhuma execução existir.
        simulacoes:
          type: array
          description: Execuções do job em ordem de criação, vinculadas às versões por regra_id. Opcional para compatibilidade com respostas anteriores.
          items:
            $ref: "#/components/schemas/Simulacao"

    RegraVersionada:
      type: object
      title: Versão da regra
      description: |
        Uma versão da regra dentro do job. Regra é imutável depois de usada: correção
        do usuário e sugestão de adaptação criam versões novas, e é o `id` daqui que
        identifica univocamente o que foi simulado.
      required: [id, versao, origem, representacao, criada_em]
      properties:
        id:
          type: string
          format: uuid
        versao:
          type: integer
          minimum: 1
          description: Sequencial dentro do job.
        origem:
          type: string
          enum: [confirmacao_usuario, sugestao_adaptacao, reprocessamento, extracao, correcao]
          description: De onde esta versão veio. `extracao` é a versão raiz extraída pelo codegen de uma submissão em texto ou da transcrição de um áudio. `correcao` é a versão que o codegen reextraiu de uma correção enviada pelo chatbot, a `regra_resultante_id` da rodada que a recebeu.
        representacao:
          $ref: "../domain/representacao-regra.schema.json"
        criada_em:
          type: string
          format: date-time

    EstadoRodada:
      type: string
      title: Estado da rodada de correção
      description: |
        Onde a rodada está no loop de correção. Existe no máximo uma rodada aberta por
        job, e ela é a mais recente.

        - `pendente`: aberta, à espera da correção do usuário. É o único estado em que
          `POST /submissoes` aceita uma correção.
        - `em_transcricao`: aberta, com a correção enviada por voz e a `api`
          transcrevendo o áudio. A entrada fica bloqueada até o desfecho; transcrita,
          a rodada passa a `em_reextracao`.
        - `em_reextracao`: aberta, com a correção enviada e o codegen reextraindo a
          regra a partir dela. A entrada fica bloqueada até o desfecho.
        - `reextracao_falhou`: fechada, porque a correção não chegou a uma versão: a
          transcrição do áudio falhou ou o codegen não conseguiu reextrair a regra. A
          `api` abre em seguida uma rodada `pendente` nova, encadeada e com os mesmos
          conflitos, para que o usuário tente de novo.
        - `corrigida`: fechada, com a correção transformada na versão
          `regra_resultante_id`. Essa versão volta à validação; se ainda tiver
          conflitos, abre outra rodada.
        - `abandonada`: fechada sem que a correção chegasse a uma versão nova, porque o
          job deixou o loop por outro caminho, como o cancelamento. Sair da tela não
          abandona a rodada.
      enum: [pendente, em_reextracao, reextracao_falhou, corrigida, abandonada, em_transcricao]

    Rodada:
      type: object
      title: Rodada de correção
      description: |
        Uma volta do loop de correção: a versão da regra que a validação reprovou, os
        conflitos que o chatbot mostrou, a correção que o usuário enviou e a versão que
        resultou dela. As rodadas de um job se encadeiam por `rodada_anterior_id`.
      required:
        - id
        - rodada_anterior_id
        - regra_analisada_id
        - conflitos
        - correcao
        - regra_resultante_id
        - estado
        - criada_em
      properties:
        id:
          type: string
          format: uuid
        rodada_anterior_id:
          type: [string, "null"]
          format: uuid
          description: |
            Rodada que esta sucede no mesmo job. Nula na primeira rodada. Uma rodada
            nova sucede outra quando a versão corrigida ainda tem conflitos ou quando
            a reextração da correção anterior falhou.
        regra_analisada_id:
          type: string
          format: uuid
          description: |
            Versão da regra, entre as `regras` do job, cuja validação apontou os
            conflitos desta rodada. Depois de uma reextração que falhou, a rodada nova
            analisa a mesma versão da anterior.
        conflitos:
          $ref: "../domain/conflitos-rodada.schema.json"
          description: Os conflitos que o chatbot mostra nesta rodada, com as partes da regra envolvidas e o motivo.
        correcao:
          type: [object, "null"]
          description: |
            A correção enviada nesta rodada. Nula enquanto o usuário não corrigiu, e
            numa rodada abandonada antes da correção.
          required: [texto, enviada_em]
          properties:
            tipo:
              $ref: "#/components/schemas/TipoSubmissao"
              description: |
                Como a correção chegou. Opcional para compatibilidade; ausente, a
                correção é por texto.
            texto:
              type: [string, "null"]
              minLength: 1
              description: |
                O texto da correção: o que o usuário escreveu ou, na correção por voz,
                a transcrição do áudio. Nulo enquanto a transcrição não existe,
                inclusive depois de ela falhar; só a correção por voz tem texto nulo.
            enviada_em:
              type: string
              format: date-time
          allOf:
            - if:
                properties:
                  texto:
                    type: "null"
                required: [texto]
              then:
                properties:
                  tipo:
                    const: voz
                required: [tipo]
        regra_resultante_id:
          type: [string, "null"]
          format: uuid
          description: |
            Versão da regra nascida desta correção, com origem `correcao`. Nula até a
            reextração produzir a versão, e por isso preenchida só em rodada
            `corrigida`.
        estado:
          $ref: "#/components/schemas/EstadoRodada"
        criada_em:
          type: string
          format: date-time

    Simulacao:
      type: object
      title: Simulação
      description: |
        A simulação do job e, quando houve sucesso, o resultado que o sandbox produziu.
        `status` e `veredito` respondem perguntas diferentes: o primeiro diz se o
        número vale, o segundo diz se ele cabe no orçamento.
      required: [id, criado_em, status, flag_baixa_rastreabilidade]
      properties:
        id:
          type: string
          format: uuid
          description: Id da simulação exigido pela trilha de auditoria.
        regra_id:
          type: string
          format: uuid
          description: Versão da regra que produziu esta simulação. Opcional para compatibilidade com respostas anteriores.
        criado_em:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/StatusResultado"
        veredito:
          $ref: "#/components/schemas/Veredito"
          description: Ausente quando o status não é sucesso.
        flag_baixa_rastreabilidade:
          type: boolean
          description: |
            Verdadeiro quando o modelo não devolveu justificativa utilizável ou quando
            a narrativa reprovou na conferência numérica. Falha de
            explicação degrada a rastreabilidade e não invalida o número; falha de
            cobertura ou de asserção invalida.
        resultado:
          $ref: "../domain/resultado-simulacao.schema.json"
          description: |
            Totais, desfecho das asserções e decomposição da diferença. Ausente quando
            o status não é sucesso, porque aí não há número. É a fonte dos valores
            exibidos: o frontend apresenta, não calcula.

    DetalhamentoSimulacao:
      type: object
      title: Detalhamento da simulação
      description: |
        Artefato completo de resultados_simulacao.linhas, consultado separadamente
        dos totais e da decomposição. Só um resultado com status sucesso pode ter
        detalhamento. A ausência de linhas indica que ele não está disponível;
        o campo é omitido, nunca null. Inclui resultados anteriores à sua produção.
      required: [simulacao_id]
      properties:
        simulacao_id:
          type: string
          format: uuid
          description: Identificador da simulação consultada.
        linhas:
          $ref: "../domain/resultado-linhas.schema.json"

    JobResumo:
      type: object
      title: Resumo do job
      description: |
        O que a listagem de histórico mostra. Sem regra, resultado nem decomposição -
        para isso existe `GET /jobs/{id}`.
      examples:
        - id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
          nome: Comissão de novembro
          status: simulacao_inviavel
          competencias: ["2025-11"]
          orcamento: 485000.0
          criado_em: "2025-11-24T14:02:00Z"
      required: [id, status, competencias, orcamento, criado_em]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: [string, "null"]
          description: |
            Nome de exibição resolvido pela API, compartilhado por todas as versões
            da regra. O nome definido pelo usuário em `jobs.nome` tem prioridade.
            Sem ele, o nome padrão vem de `submissoes.transcricao` da submissão
            inicial apontada por `jobs.submissao_id`, que guarda o texto digitado
            ou a transcrição do áudio. O frontend não calcula o nome padrão.

            A API remove espaços do início e do fim do texto, substitui cada
            sequência de espaços, tabulações e quebras de linha por um único
            espaço e usa os primeiros 50 caracteres do resultado, contados por
            pontos de código Unicode para não cortar um emoji ao meio. Textos
            com até 50 caracteres são usados inteiros, sem reticências. O nome
            padrão não é persistido em `jobs.nome`.

            No job reprocessado, sem submissão própria, a API segue
            `jobs.job_origem_id` até o primeiro job da cadeia com submissão e usa
            esse texto inicial para o nome padrão. O nome definido pelo usuário
            no job de origem é copiado ao reprocessar; renomear um deles depois
            não altera o outro. Correções e novas versões não mudam
            `jobs.submissao_id`, portanto não mudam a origem do nome padrão.

            Ausente quando não há nome definido pelo usuário nem texto inicial
            não vazio após normalização, inclusive formulário com
            `submissoes.transcricao` nulo e voz ainda sem transcrição. Nesse caso,
            o frontend mostra o rótulo com a data de criação. O tipo aceita null
            por compatibilidade com a T-200 D; a API omite o campo sem nome resolvido.
          examples: [Comissão de novembro, "Comissão de 2,5% para vendedores da loja 13"]
        status:
          $ref: "#/components/schemas/StatusJob"
        competencias:
          $ref: "#/components/schemas/Competencias"
        orcamento:
          $ref: "../domain/comum.schema.json#/$defs/brl"
        veredito:
          $ref: "#/components/schemas/Veredito"
          description: Ausente enquanto o job não tem simulação concluída com sucesso.
        criado_em:
          type: string
          format: date-time
        finalizado_em:
          type: string
          format: date-time
          description: Ausente até o job atingir estado terminal.
        job_origem_id:
          type: string
          format: uuid
          description: Preenchido quando o job nasceu de reprocessamento.

    PaginaJobs:
      type: object
      title: Página do histórico
      description: Página de jobs em ordem decrescente de criação.
      required: [itens, pagina, tamanho, total]
      properties:
        itens:
          type: array
          items:
            $ref: "#/components/schemas/JobResumo"
        pagina:
          type: integer
          minimum: 0
        tamanho:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: Total de jobs do usuário, não da página.

    EventoProgresso:
      title: Evento do stream de progresso
      description: |
        JSON de uma linha `data:` do stream. O nome do evento vai na linha `event:` e
        diz qual das três formas chegou: `etapa`, `estado` ou `resultado`.

        Os três têm `job_id`, que é redundante com o caminho e existe assim mesmo -
        um cliente que mantém mais de um stream aberto não precisa se apoiar em qual
        conexão entregou a mensagem.

        `anyOf` e não `oneOf`: quem discrimina é a linha `event:`, que é o mecanismo
        nativo do `text/event-stream` e o que o `EventSource` entrega ao cliente. As
        formas não se distinguem sozinhas, porque nenhum schema aqui fecha o objeto -
        a evolução é aditiva e um payload com campo a mais precisa continuar válido.
      anyOf:
        - $ref: "#/components/schemas/EventoEtapa"
        - $ref: "#/components/schemas/EventoEstado"
        - $ref: "#/components/schemas/EventoResultado"

    EventoEtapa:
      type: object
      title: Evento `etapa`
      description: |
        Etapa do processamento que acabou de começar. É o que alimenta o "gerando
        código…" na tela. Dispara na entrada da etapa, e por isso não se confunde com
        a trilha de auditoria, que registra a saída do nó.
      required: [job_id, etapa, status]
      properties:
        job_id:
          type: string
          format: uuid
        etapa:
          $ref: "../domain/comum.schema.json#/$defs/no_grafo"
          description: |
            Etapa iniciada, no mesmo vocabulário fechado dos nós do grafo. Usar a lista
            única evita que a tela e a trilha chamem o mesmo passo por nomes
            diferentes.
        status:
          type: string
          minLength: 1
          description: |
            Situação reportada para a etapa iniciada. `erro` indica falha do
            processamento antes da simulação e é seguido de um evento `estado` para
            `erro`, que encerra o stream. A exceção é a falha da reextração de uma
            correção, `erro` na etapa `extracao_parametros` com o job em
            `aguardando_confirmacao_parametros`: o job não muda de estado, e a correção
            é reaberta numa rodada `pendente` nova, consultável em
            `GET /jobs/{id}/rodadas`. `aguardando_correcao` na etapa `confirmacao`
            anuncia que a validação apontou os `conflitos` deste evento, e é seguido de
            um evento `estado` para `aguardando_confirmacao_parametros`. O vocabulário
            ainda não está fechado.
        conflitos:
          $ref: "../domain/conflitos-rodada.schema.json"
          description: |
            Conflitos que impedem a regra de seguir para a geração de código, com as
            partes da regra envolvidas e o motivo. Presente quando `status` é
            `aguardando_correcao`; é o que o chatbot mostra ao abrir a rodada. Ausente
            quando o evento não reporta conflito, nunca vazio. O histórico das rodadas
            anteriores não vem pelo stream, e sim por `GET /jobs/{id}/rodadas`.
      examples:
        - job_id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
          etapa: geracao_codigo
          status: iniciada
        - job_id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
          etapa: confirmacao
          status: aguardando_correcao
          conflitos:
            - elementos: [nucleo.percentual]
              motivo: percentual ausente
            - elementos: [nucleo.loja, elem.2]
              motivo: loja 13 no núcleo e na exclusão

    EventoEstado:
      type: object
      title: Evento `estado`
      description: |
        Transição da máquina de estados do job, de que a `api` é dona. É o que move a
        tela entre as fases e o que anuncia a parada, com o motivo localizado.

        A mesma forma abre toda conexão ao stream, como fotografia do estado atual -
        na primeira conexão e em toda reconexão.
      required: [job_id, status]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/StatusJob"
        status_anterior:
          $ref: "#/components/schemas/StatusJob"
          description: Ausente na transição inicial e na fotografia de conexão.
        motivo:
          type: string
          description: Razão localizada da parada. Ausente fora de paradas.
      examples:
        - job_id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
          status: simulacao_inviavel
          status_anterior: simulando

    EventoResultado:
      type: object
      title: Evento `resultado`
      description: |
        Anuncia que a simulação terminou. Carrega a referência e o desfecho, não os
        números: a tela busca `GET /jobs/{id}` e lê os valores de um lugar só, para
        que resultado e stream não tenham duas formas do mesmo dado para divergir.
      required: [job_id, simulacao_id, status]
      properties:
        job_id:
          type: string
          format: uuid
        simulacao_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/StatusResultado"
        veredito:
          $ref: "#/components/schemas/Veredito"
          description: Ausente quando o status não é sucesso.
      examples:
        - job_id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
          simulacao_id: "b81e0f4c-52a9-4f0b-8a3d-7c2e5d10ab93"
          status: sucesso
          veredito: inviavel
