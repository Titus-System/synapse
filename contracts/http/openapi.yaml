                            competencia: { "2025-11": 11788.0 }
                descricaoEmExtracao:
                  summary: Descrição em texto com nome padrão, ainda sem regra extraída
                  description: |
                    A submissão inicial contém "  Comissão de 2,5%\tpara vendedores\nda loja 13  ".
                    A API normaliza os espaços; o resultado tem menos de 50 caracteres.
                  value:
                    id: "a2c4e6f8-0b1d-4e3f-8a5c-7e9b1d3f5a70"
                    nome: Comissão de 2,5% para vendedores da loja 13
                    status: gerando_regra
                    origem: texto
                    competencias: ["2025-11"]
                    orcamento: 485000.0
