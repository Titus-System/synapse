openapi: 3.1.0

info:
  title: Synapse - API HTTP
  version: 1.0.0
  summary: Contrato REST e SSE entre o frontend e a api do Synapse.
  description: |
    Fonte única do contrato HTTP da Sprint 1. Nenhuma rota da Sprint 1 existe fora
    deste arquivo: `frontend` e `api` são escritos em paralelo contra ele e só se
    encontram na integração.

    Onze operações. Dez são sobre o recurso `job`, que é a unidade de trabalho do
    sistema e o que a `api` possui de ponta a ponta, e uma recebe as submissões do
    usuário: a descrição de uma regra nova, digitada ou falada, e a correção
    enviada pelo chatbot. O ciclo é assíncrono: a criação devolve o job em
    processamento, o acompanhamento é por stream de eventos e o resultado aparece
    na consulta do job quando existe.

    **Fluxo de trabalho padrão:** As operações formam um ciclo, não uma lista solta de
    endpoints. Da submissão ao fechamento:

    * Job é a entidade que envelopa todo o fluxo de trabalho, desde a validação da regra até o resultado da simulação.

    1. `POST /submissoes`, com `finalidade = entrada_inicial`, recebe a descrição
       da regra, em texto ou em áudio, com o orçamento e as competências, e cria a
       submissão e o job que a processa. O job de texto nasce em `gerando_regra`,
       porque a descrição já está pronta para a extração; o de voz nasce em
       `aguardando_transcricao`. `POST /jobs` continua recebendo o formulário de
       campos fixos da Sprint 1, cuja regra já nasce estruturada e cujo job entra
       direto em `gerando_regra`.
    2. O cliente abre conexão SSE `GET /jobs/{id}/events` logo em seguida. O primeiro
       evento é a fotografia do estado atual; os demais chegam conforme o job avança,
       inclusive o que os próximos passos disparam. A conexão pode cair e ser
       reaberta a qualquer momento sem perda: o job vive na `api`, não na conexão, e
       reabrir devolve a mesma fotografia de novo.
    3. Se a fotografia (inicial ou de uma reconexão) mostrar
       `aguardando_confirmacao_parametros`, o cliente busca a regra por
       `GET /jobs/{id}` - o stream informa o status, não o conteúdo da regra - e
       exibe `regra.representacao` na tela de confirmação. `POST
       /jobs/{id}/parameters` confirma ou corrige o que foi exibido. Dali em diante,
       geração de código, delegação ao worker e simulação acontecem sem nenhuma
       chamada REST adicional - o cliente só observa pelo stream aberto no passo 2.
    4. Quando o stream anuncia o evento `resultado`, o cliente consulta
       `GET /jobs/{id}` para ler os números: totais, asserções e decomposição. O
       evento no stream anuncia o desfecho; não carrega os valores.
       O detalhamento por competência e matrícula é consultado inteiro em
       `GET /jobs/{id}/simulacoes/{simulacaoId}/linhas`, quando a tela precisa dele.
    5. `POST /jobs/{id}/actions` fecha o ciclo: confirmar e liberar (recusado se a
       simulação for inviável), cancelar, salvar ou arquivar.
    6. Job fechado aparece em `GET /jobs`, o histórico. `POST /jobs/{id}/reprocessar`
       parte de um job arquivado e cria um job novo, que reabre o ciclo a partir do
       passo 2 com a regra da versão anterior já semeada.

    **Loop de correção.** Quando a validação aponta conflitos na regra, o stream
    anuncia o evento `etapa` com `status` `aguardando_correcao` e os `conflitos`, e o
    job vai a `aguardando_confirmacao_parametros`. O chatbot lê o histórico em
    `GET /jobs/{id}/rodadas` - na conexão inicial e em toda reconexão, porque o stream
    não guarda histórico - e, havendo rodada `pendente`, envia a correção por
    `POST /submissoes`. É essa rota que distingue o loop da confirmação do passo 3:
    no loop, a rodada mais recente está aberta. A reextração e a revalidação da
    versão corrigida são assíncronas e chegam pelo stream: uma versão ainda com
    conflitos abre outra rodada, e uma sem conflitos segue para a geração de código
    e a simulação, como no passo 3.

    **A forma da regra e a do resultado não são declaradas aqui.** Elas vêm por
    `$ref` aos schemas de `contracts/domain/`, que são a autoridade sobre o formato
    e são os mesmos que o banco e os eventos usam. Duplicar a estrutura neste
    arquivo criaria uma segunda definição para divergir da primeira.

    **Vocabulário.** Percentual e diferença percentual são fração, nunca
    porcentagem: `0.025` são 2,5%. Competência é `AAAA-MM`. Código de loja, marca e
    cargo é sempre string. As mesmas convenções de `contracts/domain/README.md`.

    **Evolução aditiva.** Campo novo entra opcional, campo existente não é removido
    nem renomeado sem decisão explícita. Nenhum schema fecha o objeto com
    `additionalProperties: false`, e um cliente ignora campo que não conhece.

    **Fora do escopo desta versão.** A consulta de auditoria
    `GET /jobs/{id}/audit` e a rota de autenticação que emite a sessão exigida por
    `security`. As duas entram quando suas tarefas entrarem. Nenhuma rota devolve
    o áudio enviado nem o texto transcrito da entrada inicial.

servers:
  - url: /api
    description: |
      Base que o frontend usa, configurável por `VITE_API_BASE_URL` e com `/api` como
      padrão. O prefixo é do roteamento de borda; a aplicação Spring serve estes
      caminhos na raiz, ao lado de `/actuator/health` e `/metrics`, que não fazem
      parte deste contrato.

security:
  - keycloakOidc: []

tags:
  - name: jobs
    description: Criação, acompanhamento, finalização e reprocessamento de jobs de simulação.
  - name: submissoes
    description: Entradas do usuário, por texto ou voz - a descrição de uma regra nova e a correção enviada pelo chatbot.

paths:
  /jobs:
    post:
      tags: [jobs]
      operationId: criarJob
      summary: POST /jobs Submete uma regra e cria o job que a simula.
      description: |
        Recebe o formulário de campos fixos da Sprint 1 e cria o job. A `api` grava a
        submissão, o job e o evento de outbox na mesma transação, de modo que nenhum
        job criado fique sem o evento de processamento correspondente.

        **O corpo tem forma de submissão, mas a rota fica sob /jobs** porque o
        recurso com ciclo de vida neste contrato é o job: é o `id` dele, não o da
        submissão, que as outras seis operações rastreiam, e a submissão em si nunca
        é lida de volta por nenhuma rota daqui. A rota nomeia o que o cliente vai
        acompanhar, não a forma literal do que envia.

        A resposta chega antes de a simulação terminar: o processamento leva minutos
        e é acompanhado por `GET /jobs/{id}/events`. O job criado nasce em
        `gerando_regra`, porque o formulário já entrega a regra validada e
        estruturada - não há etapa de confirmação para esta origem.

        Recusa a criação quando o núcleo está incompleto, com código próprio e
        distinto do da recusa de liberação: aqui o que falta é dado da regra, e o
        corpo aponta qual campo falta em vez de devolver "não foi possível
        processar".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarJobRequisicao"
      responses:
        "201":
          description: |
            Job criado. O corpo é o job, e o que ele traz é o que existe no instante da
            criação: `id`, `status`, `origem`, `competencias`, `orcamento`,
            `criado_em`, `submissao_id` e `regra`.

            **`simulacao`, `iniciado_em`, `finalizado_em` e `motivo` são ausentes por
            construção, não por atraso.** O job nasce em `gerando_regra` e a geração
            de código já começou; ela e a simulação são assíncronas. Quem consome
            esta resposta não precisa tratar esses campos, e eles aparecem em
            `GET /jobs/{id}` quando passarem a existir.

            **`regra` está presente**, e não é exceção à assincronia. O formulário já
            chega com parâmetros estruturados, então a versão 1 da regra nasce da
            própria submissão, na mesma transação que grava o job e o evento de outbox
            - é o que `regra-submetida` exige ao pedir `regra_id` na origem
            `formulario`. É também o que a tela de acompanhamento exibe em seguida,
            sem um `GET` adicional.
          headers:
            Location:
              description: Caminho do job criado.
              schema:
                type: string
                examples: ["/api/jobs/3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                jobRecemCriado:
                  summary: Job recém-criado, geração em curso
                  value:
                    id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
                    status: gerando_regra
                    origem: formulario
                    competencias: ["2025-11"]
                    orcamento: 485000.0
                    criado_em: "2025-11-24T14:02:00Z"
                    submissao_id: "b81e0f4c-52a9-4f0b-8a3d-7c2e5d10ab93"
                    regra:
                      id: "9c7d3e21-4a6b-4c8d-9e0f-1a2b3c4d5e6f"
                      versao: 1
                      origem: confirmacao_usuario
                      representacao:
                        nucleo:
                          vigencia: { inicio: "2025-11", fim: "2025-11" }
                          loja: ["13"]
                          marca: ["10", "20"]
                          cargo: ["100", "300"]
                          percentual: 0.025
                        especificacoes: []
                      criada_em: "2025-11-24T14:02:00Z"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "422":
          description: |
            Núcleo incompleto: a regra não tem o mínimo para ser simulada. `elementos`
            nomeia cada campo ausente, porque a tela precisa destacar o campo e não
            uma mensagem genérica.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                nucleoIncompleto:
                  summary: Percentual ausente
                  value:
                    codigo: nucleo_incompleto
                    mensagem: A regra precisa do percentual de comissionamento para ser simulada.
                    elementos:
                      - ref: nucleo.percentual
                        motivo: Campo obrigatório não informado.

    get:
      tags: [jobs]
      operationId: listarJobs
      summary: Lista o histórico de jobs do usuário autenticado.
      description: |
        Histórico paginado em ordem decrescente de criação. É por aqui que o
        usuário reencontra um job depois de fechar a aba: o job vive na `api`, não na
        sessão do navegador.

        Devolve o resumo de cada job, não o job inteiro. Regra, resultado e
        decomposição saem de `GET /jobs/{id}`, para que a listagem não carregue
        dezenas de agregados que a tela de histórico não mostra.

        Lista os jobs do próprio usuário, e não os do sistema: histórico é do fluxo
        operacional, que é do papel `PROFISSIONAL DE RH` (DEC-087).
      parameters:
        - name: pagina
          in: query
          required: false
          description: Página, começando em zero.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: tamanho
          in: query
          required: false
          description: Itens por página.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Página do histórico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaJobs"
              examples:
                nomesResolvidos:
                  summary: Nome definido pelo usuário, nome padrão e nome ausente
                  value:
                    itens:
                      - id: "a2c4e6f8-0b1d-4e3f-8a5c-7e9b1d3f5a70"
                        nome: Comissão de 2,5% para vendedores da loja 13
                        status: gerando_regra
                        competencias: ["2025-11"]
                        orcamento: 485000.0
                        criado_em: "2025-11-24T15:10:00Z"
                      - id: "c3d5e7f9-1a2b-4c6d-8e0f-2a4b6c8d0e12"
                        status: aguardando_transcricao
                        competencias: ["2025-11"]
                        orcamento: 485000.0
                        criado_em: "2025-11-24T15:00:00Z"
                      - id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
                        nome: Comissão de novembro
                        status: simulacao_inviavel
                        competencias: ["2025-11"]
                        orcamento: 485000.0
                        criado_em: "2025-11-24T14:02:00Z"
                    pagina: 0
                    tamanho: 20
                    total: 3
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"

  /jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      operationId: consultarJob
      summary: Consulta o estado, as regras e o resultado de um job.
      description: |
        Estado corrente do job e tudo que já existe dele. `regras` contém todas as
        versões formadas para o job, em ordem crescente de versão. Os demais campos
        opcionais aparecem conforme o job avança: `simulacao` depois que a execução
        termina, `motivo` quando o job parou.

        É a fonte dos números exibidos. Nenhum valor aqui deve ser recalculado ou
        derivado pelo cliente: a aritmética é determinística, roda sobre os dados
        históricos e chega pronta nesta resposta.
      responses:
        "200":
          description: O job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetalhado"
              examples:
                simulacaoInviavel:
                  summary: Simulação concluída, acima do orçamento, com nome definido pelo usuário
                  value:
                    id: "3f2b1c40-0d18-4a51-9f2e-6c1d9a77b021"
                    nome: Comissão de novembro
                    status: simulacao_inviavel
                    origem: formulario
                    competencias: ["2025-11"]
                    orcamento: 485000.0
                    criado_em: "2025-11-24T14:02:00Z"
                    iniciado_em: "2025-11-24T14:02:03Z"
                    finalizado_em: "2025-11-24T14:04:47Z"
                    submissao_id: "b81e0f4c-52a9-4f0b-8a3d-7c2e5d10ab93"
                    regras:
                      - id: "9c7d3e21-4a6b-4c8d-9e0f-1a2b3c4d5e6f"
                        versao: 1
                        origem: confirmacao_usuario
                        representacao:
                          nucleo:
                            vigencia: { inicio: "2025-11", fim: "2025-11" }
                            loja: ["13"]
                            marca: ["10", "20"]
                            cargo: ["100", "300"]
                            percentual: 0.025
                          especificacoes: []
                        criada_em: "2025-11-24T14:02:00Z"
                      - id: "1f2e3d4c-5b6a-4978-8d7c-6e5f4a3b2c1d"
                        versao: 2
                        origem: confirmacao_usuario
                        representacao:
                          nucleo:
                            vigencia: { inicio: "2025-11", fim: "2025-11" }
                            loja: ["13"]
                            marca: ["10", "20"]
                            cargo: ["100", "300"]
                            percentual: 0.03
                          especificacoes: []
                        criada_em: "2025-11-24T14:03:10Z"
                    simulacao:
                      id: "d4e5f607-1234-4a5b-8c9d-0e1f2a3b4c5d"
                      regra_id: "1f2e3d4c-5b6a-4978-8d7c-6e5f4a3b2c1d"
                      criado_em: "2025-11-24T14:04:47Z"
                      status: sucesso
                      veredito: inviavel
                      flag_baixa_rastreabilidade: false
                      resultado:
                        totais:
                          baseline: 480312.0
                          simulado: 492100.0
                          diferenca_abs: 11788.0
                          diferenca_pct: 0.0245
                          orcamento: 485000.0
                        assercoes:
                          - nome: sem_comissao_negativa
                            resultado: ok
                            detalhe: null
                        decomposicao:
                          elemento: { "nucleo.percentual": 11788.0 }
                          loja: { "13": 7100.0, "58": 4688.0 }
                          marca: { "10": 11788.0 }
                          cargo: { "100": 9200.0, "150": 2588.0 }
                          competencia: { "2025-11": 11788.0 }
                    simulacoes:
                      - id: "d4e5f607-1234-4a5b-8c9d-0e1f2a3b4c5d"
                        regra_id: "1f2e3d4c-5b6a-4978-8d7c-6e5f4a3b2c1d"
                        criado_em: "2025-11-24T14:04:47Z"
                        status: sucesso
                        veredito: inviavel
                        flag_baixa_rastreabilidade: false
                        resultado:
                          totais:
                            baseline: 480312.0
